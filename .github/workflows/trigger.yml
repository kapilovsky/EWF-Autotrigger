name: Varicent Workflow trigger

on:
  schedule:
    - cron: "50 * * * *"   
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with: 
        python-version: "3.11"

    - name: Install Dependencies
      run: pip install requests pandas

    - name: Run Script
      env:
        VARICENT_EMAIL: ${{ secrets.VARICENT_EMAIL}}
        VARICENT_PASSWORD: ${{secrets.VARICENT_PASSWORD}}
      run: python script.py
    
